[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only", # gaki itself
    "GPL-3.0-or-later", # aurelia-steam-vent-chat, liblootrs
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Each ignore is for a version pinned by a dependency gaki doesn't own, and
# names why the advisory can't be reached. Revisit when the pin moves.
ignore = [
    # protobuf: stack overflow on deeply nested messages. steam-vent-proto-common
    # (under steam-vent) pins `=3.5.1`. Most messages come from Valve's CM servers over an encrypted,
    # authenticated channel; depot manifests come from CDN servers (HTTPS when
    # any server offers it). The worst case is a crash, not code execution.
    { id = "RUSTSEC-2024-0437", reason = "pinned =3.5.1 by steam-vent-proto-common; CM traffic and CDN manifests, crash only" },
    # rsa: Marvin timing attack on private-key operations. No fixed release
    # exists. steam-vent only encrypts the password with Steam's public key,
    # so no private key is ever used.
    { id = "RUSTSEC-2023-0071", reason = "public-key encryption only (login password); no private key" },
]

[bans]
multiple-versions = "warn"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# liblootrs (the profile model) until it is published.
allow-git = ["https://github.com/Gigas002/lootrs"]
