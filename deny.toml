[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # gaki itself
    "GPL-3.0-only",
    # aurelia-steam-vent-chat, liblootrs
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Each ignore is for a version pinned by a dependency gaki doesn't own, and
# names why the advisory can't be reached. Revisit when the pin moves.
ignore = [
]

[bans]
multiple-versions = "warn"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# liblootrs (the profile model) until it is published.
allow-git = ["https://github.com/Gigas002/lootrs"]
