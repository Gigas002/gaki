[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }
# aws-lc-sys (rustls' default crypto provider, via reqwest) carries the OpenSSL
# license, which the FSF deems GPL-incompatible. Tracked in docs/PLAN.md step 7.3.
exceptions = [
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[bans]
multiple-versions = "warn"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
