[package]
name = "gaki-tui"
description = "Terminal UI for the gaki Steam client."
readme = "README.md"
version.workspace = true
edition.workspace = true
# Upstream Aurelia-TUI is GPL-3.0 (only); see LICENSE.
license = "GPL-3.0-only"
repository.workspace = true
keywords = ["tui", "steam", "gaki", "gaming"]
categories = ["command-line-utilities"]

[[bin]]
name = "gaki"
path = "src/main.rs"

[dependencies]
pretty-bytes = "0.2.2"
shellexpand = "2.1.0"

serde_json = "1.0"
serde = {version = "1.0", features = ["derive"] }

crossterm = { version = "0.25"}
tui = { version = "0.18", default-features = false, features = ['crossterm', 'serde'] }

fuzzy-matcher = "0.3.7"
regex = "1"

# Render the Steam login QR challenge as terminal blocks on the login page.
qrcode = { version = "0.14", default-features = false }

reqwest = { version = "0.11", features = ["blocking", "json"] }

atty = "0.2"

image = "0.24"

[dependencies.tui-image-rgba-updated]
version = "0.2.2"
