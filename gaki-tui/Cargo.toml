[package]
name = "gaki-tui"
description = "Terminal UI for the gaki Steam client."
readme = "README.md"
version.workspace = true
edition.workspace = true
# Upstream Aurelia-TUI is GPL-3.0 (only); the text is the root LICENSE.
license = "GPL-3.0-only"
repository.workspace = true
keywords = ["tui", "steam", "gaki", "gaming"]
categories = ["command-line-utilities"]

[[bin]]
name = "gaki-tui"
path = "src/main.rs"

[features]
default = ["install", "cloud", "collections"]
install = ["libgaki/install"]
cloud = ["libgaki/cloud"]
collections = ["libgaki/collections"]
versioning = ["install", "libgaki/versioning"]
depot = ["install", "libgaki/depot"]
workshop = ["install", "libgaki/workshop"]
social = ["libgaki/social"]
inventory = ["libgaki/inventory"]
market = ["inventory", "libgaki/market"]
store = ["libgaki/store"]

[dependencies]
# A TUI always browses a library, so login and the library are its floor; the
# rest are forwarded from libgaki one-to-one (see docs/PLAN.md, feature matrix).
libgaki = { workspace = true, default-features = false, features = ["library"] }
anyhow.workspace = true
clap.workspace = true
fuzzy-matcher = "0.3.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Render the Steam login QR challenge as terminal blocks on the login page.
qrcode.workspace = true
# Crossterm comes re-exported as `ratatui::crossterm`, which keeps the two in step.
ratatui = { version = "0.30", features = ["serde"] }
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
