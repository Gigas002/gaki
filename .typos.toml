[default.extend-words]
ratatui = "ratatui"
# Steam/Valve spellings we don't control
# `.sav` save-game files
sav = "sav"
# Steam proto/KeyValues field
packageid = "packageid"
# sic, Valve proto field `unvailable_for_country_restriction`
unvailable = "unvailable"
# the game title, in TUI test fixtures
Dota = "Dota"
# Valid spelling variants / crate names
unparseable = "unparseable"
# `flate2` crate
flate = "flate"

[files]
extend-exclude = [
    "target/",
    # Valve's protos, vendored as-is: their typos are field and enum names
    "gaki-steam-vent-proto/protos/",
]
