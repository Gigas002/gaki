# Per-game overrides: ~/.config/gaki/games.toml
# A game only needs an entry when it overrides something.

[[game]]
app_id = 292030
name = "witcher3"                 # alias usable everywhere an app id is
profile = "proton-cachyos"
platform = "windows"
args = ["-skipIntro"]
# Wrapped inside the profile's wrappers. A script works: it gets the game
# command as "$@" (end it with `exec "$@"`) and GAKI_APP_ID, GAKI_GAME_DIR, ...
wrappers = ["~/games/run_scripts/witcher3/script.sh"]
steam = "host"                    # auto | host | none; host = always bridge to Steam
# shader_cache = "/mnt/fast/shaders"  # this game's shader caches: <dir>/292030, or "off"
[game.env]
DXVK_HUD = "fps"

[[game]]
app_id = 570
name = "dota2"
profile = "native"
