# gaki-tui key bindings. Copy to ~/.config/gaki/tui/keybinds.toml
# (or $XDG_CONFIG_HOME/gaki/tui/keybinds.toml) and uncomment what you change.
#
# Each line binds an action to a key or a list of keys:
#
#   install = "i"
#   sort = ["s", "ctrl+s"]
#   # no key; the Actions menu still has it
#   hide = []
#
# Keys: one character, case-sensitive ("E" is Shift+e), or a name: Enter,
# Esc, Tab, BackTab (Shift+Tab), Backspace, Delete, Insert, Home, End,
# PageUp, PageDown, Up, Down, Left, Right, Space, F1-F24. Prefix "ctrl+" or
# "alt+" for modifiers ("ctrl+r", "alt+PageDown").
#
# An action left out keeps its default. gaki-tui refuses to start, naming
# the line, on an unknown section or action, a key it can't read, or two
# actions on one key. Esc, ?, the arrow keys and Ctrl+C can't be rebound;
# text prompts and y/n questions keep their keys too.
#
# [library] is the game list with no overlay open. [overlay] holds the keys
# every overlay shares; each overlay below adds its own, which mustn't
# clash with [overlay]. Actions marked with a tab only work there, so two
# tabs may share a key. Overlays not listed here keep fixed keys for now.

[library]

# Moving around (the arrow keys always move too)
# quit = "q"
# down = "j"
# up = "k"
# top = "g"
# bottom = "G"
# page_down = "PageDown"
# page_up = "PageUp"

# Filtering and tabs
# filter = "/"
# next_tab = "Tab"
# previous_tab = "BackTab"
# tab_all = "1"
# tab_installed = "2"
# tab_updates = "3"
# tab_favourites = "4"
# tab_friends = "5"
# friends = "F"
# sort = "s"
# description = "i"

# Installing
# actions_menu = "Enter"
# install = "d"
# pause_resume = "Space"
# cancel_install = "c"
# uninstall = "x"
# move_install = "M"
# relink = "K"
# import = "N"
# verify = "v"
# update = "U"
# versions = "V"
# branches = "b"

# Overlays
# collections = "O"
# achievements = "a"
# inventory = "I"
# market_listings = "m"
# market_search = "S"
# workshop = "W"
# dlc = "D"
# depots = "o"
# proton = "P"
# running = "R"
# store = "Y"
# steam_store = "J"
# installs = "X"
# game_info = "n"
# cloud = "C"
# launch_options = "L"

# The game
# favourite = "f"
# hide = "H"
# steam_page = "E"
# protondb = "B"
# proton_issues = "T"
# steamdb = "Z"

# Session
# reload = "r"
# account = "A"
# settings = "p"
# wallet = "w"
# sign_in = "l"

# Keys every overlay shares: moving, scrolling, tabs, closing.
[overlay]
# close = "q"
# down = "j"
# up = "k"
# page_down = "PageDown"
# page_up = "PageUp"
# next_tab = "Tab"
# previous_tab = "BackTab"

# The Installs overlay (`X`): the queue, the Duplicates and the Transfer tabs.
[installs]
# Queue tab:
# resume = ["r", "Enter"]
# resume_all = "R"
# pause = "p"
# stop = "s"
# forget = "f"
# forget_and_delete = "F"
# Duplicates tab:
# rescan = "r"
# Transfer tab:
# edit_path = "e"
# export_all = "a"
# export = "x"
# import = "i"

# The Settings overlay (`p`), by tab.
[settings]
# Settings tab:
# edit = "Enter"
# unset = "x"
# Profiles tab:
# make_default = "d"
# Check tab:
# check_again = "r"
# Daemons tab:
# stop_daemon = "s"
# stop_all_daemons = "S"
# refresh_daemons = "r"
# Clean tab:
# clean = "x"
# all_shaders = "a"
# rescan_clean = "r"

# The Workshop overlay's status list (`W`).
[workshop]
# browse = "b"
# install = "i"
# uninstall = "u"
# update_all = "U"
# reload = "r"

# The Workshop browse pane. It takes the search text, so only non-character keys can be bound.
[workshop_browse]
# subscribe = "Tab"
# rate_up = "F1"
# rate_down = "F2"
# comments = "F3"
# install = "F4"

# The Workshop comments sub-pane.
[workshop_comments]
# write = "c"

# The per-game Store overlay (`Y`).
[store]
# next_section = "l"
# previous_section = "h"
# regions = "r"

# The Steam Store overlay (`J`).
[steam_store]
# next_section = "l"
# previous_section = "h"
# details = "Enter"
# search = "/"
# wishlist = "w"
# store_page = "E"
# next_deals = "s"
# reload = "r"

# The Depots overlay (`o`).
[depots]
# files = "Enter"
# steamdb = "Z"

# The depot file view.
[depot_files]
# filter = "/"
# branch = "b"
# download = "d"

# The Game info overlay (`n`), by tab.
[game_info]
# Checks tab:
# check_again = "r"
# Artwork tab:
# save_artwork = "s"
# artwork_folder = "o"

# The Cloud saves overlay (`C`).
[cloud]
# sync = "s"
# download = "d"
# upload = "u"
# keep_cloud = "c"
# keep_local = "l"

# The Collections overlay (`O`).
[collections]
# add = "a"
# remove = "r"
# new = "n"
# rename = "e"
# delete = "x"
# pull = "P"
# push = "U"
# sync = "S"

# The Versions overlay (`V`).
[versions]
# pin = "p"
# unpin = "u"
# downgrade = "d"
# steamdb = "Z"

# The launch target picker (Play as).
[launch_targets]
# launch = "Enter"

# The per-game settings overlay.
[game_settings]
# edit = "Enter"

# The install location picker.
[install_picker]
# install = "Enter"

# The DLC overlay (`D`).
[dlc]
# enable = "e"
# disable = "x"

# The beta branches overlay (`b`).
[branches]
# switch = ["Enter", "s"]

# The running games overlay (`R`).
[running]
# stop = ["s", "x"]

# The Proton overlay (`P`).
[proton]
# make_default = "d"
# install = "i"
# uninstall = "u"

# The account overlay (`A`); any other key closes it.
[account]
# log_out = "o"

# The market search overlay (`S`). It takes the query, so only keys that don't type can be bound.
[market_search]
# price = "Tab"

# The Friends tab. Moving and leaving (`close`) come from `[overlay]`; `Tab` cycles the library's tabs.
[friends]
# chat = ["Enter", "c"]
# chat_window = "t"
# add = "a"
# profile = "v"
# lookup = "/"
# remove = "x"
# leave = "F"

# A user's profile (`v` in the Friends tab).
[user_profile]
# lookup = "/"
# profile_page = "E"

# The Actions menu (`Enter`). It filters as you type, so only keys that don't type can be bound; the arrows always move.
[actions_menu]
# run = "Enter"
# next = []
# previous = []
