# A library file: `gaki-cli library export` writes one, and
# `gaki-cli library import library.toml` installs every game in it that
# isn't installed yet. It isn't configuration and doesn't go in ~/.config/gaki.

[[game]]
app_id = 1245620
# for reading; import doesn't need it
name = "ELDEN RING"
# windows | linux; unset picks it as `install` would
platform = "windows"

[[game]]
app_id = 570
name = "Dota 2"
platform = "linux"
# the beta branch it was on; installs take the default
branch = "beta"
# branch, and import prints how to switch

[[game]]
# only app_id is required
app_id = 620
