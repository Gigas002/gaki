[workspace]
members = ["gaki-steam-cdn", "libgaki", "gaki-cli", "gaki-tui"]
resolver = "3"

[workspace.package]
version = "0.1.41"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Gigas002/gaki"

[workspace.dependencies]
gaki-steam-cdn = { path = "gaki-steam-cdn", version = "0.1.41" }
libgaki = { path = "libgaki", default-features = false }
# The profile schema and its shared checks (D9). Only the model is used: no
# wine/umu runner code, so the runner features stay off.
liblootrs = { git = "https://github.com/Gigas002/lootrs", branch = "master", default-features = false }

aes = "0.9" # gaki-steam-cdn: AES-256 for depot chunks and encrypted manifest file names
anyhow = "1"
async-trait = "0.1"
base64 = "0.23" # gaki-steam-cdn: encrypted manifest file names
bytes = "1"
cbc = "0.2" # gaki-steam-cdn: the CBC mode those use
clap = { version = "4", features = ["derive"] }
crc32fast = "1" # gaki-steam-cdn: VZ chunk checksums
filetime = "0.2" # Stamp downloaded Cloud saves with their cloud mtime so re-sync doesn't churn
futures = "0.3"
fuzzy-matcher = "0.3.7" # gaki-tui's fuzzy library filter
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
itertools = "0.15"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] } # The Secret Service backend keyring 3's `sync-secret-service` used (libdbus)
keyring-core = "1" # The keyring `Entry` API; the store above backs it
keyvalues-parser = "0.2" # gaki-steam-cdn: text VDF from PICS
keyvalues-serde = "0.2" # Text VDF deserialization into structs
libc = "0.2"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization"] } # gaki-steam-cdn: Steam's VZ (LZMA) chunk containers
protobuf = "3.5" # rust-protobuf runtime; matches steam-vent-proto's MessageField/EnumOrUnknown
protobuf-codegen = "3.5" # Pure-Rust codegen (no protoc); tracks the `protobuf` runtime
qrcode = { version = "0.14", default-features = false } # Terminal QR rendering for `login --qr`
# Crossterm comes re-exported as `ratatui::crossterm`, which keeps the two in step.
# `unstable-rendered-line-info`: `Paragraph::line_count`, the wrapped height
# the Store overlay clamps its scroll to.
ratatui = { version = "0.30", features = ["serde", "unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
rand = "0.10" # Match steam-vent's rand version so only one copy is linked
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "socks"] }
rpassword = "7"
ruzstd = "0.9" # gaki-steam-cdn: Steam's VSZ (Zstandard) chunk containers
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
steam-vdf-parser = "0.1.1" # Raw binary PICS VDF parsing (not supported by keyvalues-serde or steam-vent)
steam-vent = "0.5"
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.5.0" } # Fork ported to steam-vent 0.5
steam-vent-proto = "=0.5.2" # Not re-exported as steam_vent::proto since 0.5
steam-vent-proto-common = "0.5.1" # RpcMethod/RpcMessage traits for the hand-wired CloudConfigStore RPC
steamid-ng = "3" # Matches steam-vent's steamid-ng
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] } # Process listing for `kill`/`daemon`; `disk` for free-space checks
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "io-util", "sync", "io-std", "process"] }
toml = "1"
toml_edit = "0.25"
tokio-stream = "0.1" # Consume steam-vent's notification broadcast streams (friend chat events)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] } # Steam Cloud serves deflate-compressed single-file archives; nothing else is read
