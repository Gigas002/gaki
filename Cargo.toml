[workspace]
members = ["libgaki", "gaki-cli", "gaki-tui"]
resolver = "3"

[workspace.package]
version = "0.1.41"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Gigas002/gaki"

[workspace.dependencies]
libgaki = { path = "libgaki" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
filetime = "0.2" # Stamp downloaded Cloud saves with their cloud mtime so re-sync doesn't churn
hex = "0.4"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
keyvalues-serde = "0.2" # Text VDF deserialization into structs
libc = "0.2"
protobuf = "3.5" # rust-protobuf runtime; matches steam-vent-proto's MessageField/EnumOrUnknown
protobuf-codegen = "3.5" # Pure-Rust codegen (no protoc); tracks the `protobuf` runtime
qrcode = { version = "0.14", default-features = false } # Terminal QR rendering for `login --qr`
rand = "0.10" # Match steam-vent's rand version so only one copy is linked
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "socks"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
steam-cdn = { package = "aurelia-steam-cdn", version = "1.0.0" } # Fork ported to steam-vent 0.5
steam-vdf-parser = "0.1.1" # Raw binary PICS VDF parsing (not supported by keyvalues-serde or steam-vent)
steam-vent = "0.5"
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.5.0" } # Fork ported to steam-vent 0.5
steam-vent-proto = "=0.5.2" # Not re-exported as steam_vent::proto since 0.5
steam-vent-proto-common = "0.5.1" # RpcMethod/RpcMessage traits for the hand-wired CloudConfigStore RPC
steamid-ng = "3" # Matches steam-vent's steamid-ng
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] } # Process listing for `kill`/`daemon`; `disk` for free-space checks
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "io-util", "sync", "io-std", "process"] }
toml = "1"
tokio-stream = "0.1" # Consume steam-vent's notification broadcast streams (friend chat events)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
zip = "2.2.2"
