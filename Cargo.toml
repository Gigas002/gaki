[workspace]
members = [
    "gaki-steam-vent-proto",
    "gaki-steam-vent-crypto",
    "gaki-steam-vent",
    "gaki-steam-cdn",
    "libgaki",
    "gaki-cli",
    "gaki-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Gigas002/gaki"

[workspace.dependencies]
gaki-steam-vent-proto = { path = "gaki-steam-vent-proto", version = "0.1.0" }
gaki-steam-vent-crypto = { path = "gaki-steam-vent-crypto", version = "0.1.0" }
gaki-steam-vent = { path = "gaki-steam-vent", version = "0.1.0" }
gaki-steam-cdn = { path = "gaki-steam-cdn", version = "0.1.0" }
libgaki = { path = "libgaki", version = "0.1.0", default-features = false }
# The profile schema and its shared checks (D9). Only the model is used: no
# wine/umu runner code, so the runner features stay off.
liblootrs = { git = "https://github.com/Gigas002/lootrs", branch = "master", default-features = false }

# gaki-steam-cdn: AES-256 for depot chunks and encrypted manifest file names
aes = "0.9"
anyhow = "1"
async-trait = "0.1"
# gaki-steam-cdn: encrypted manifest file names
base64 = "0.23"
bytes = "1"
# gaki-steam-cdn: the CBC mode those use
cbc = "0.2"
clap = { version = "4", features = ["derive"] }
# gaki-steam-cdn: VZ chunk checksums
crc32fast = "1"
# gaki-steam-vent: incoming-message routing tables
dashmap = "6"
# Stamp downloaded Cloud saves with their cloud mtime so re-sync doesn't churn
filetime = "0.2"
# gaki-steam-vent: gzipped multi-messages
flate2 = "1"
futures = "0.3"
# gaki-tui's fuzzy library filter
fuzzy-matcher = "0.3"
hex = "0.4"
# gaki-steam-vent-crypto: Steam Guard TOTP
hmac = "0.13"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
itertools = "0.15"
# The Secret Service backend keyring 3's `sync-secret-service` used (libdbus)
dbus-secret-service-keyring-store = { version = "1", features = [
    "crypto-rust",
] }
# The keyring `Entry` API; the store above backs it
keyring-core = "1"
# gaki-steam-cdn: text VDF from PICS
keyvalues-parser = "0.2"
# Text VDF deserialization into structs
keyvalues-serde = "0.2"
libc = "0.2"
# gaki-steam-cdn: Steam's VZ (LZMA) chunk containers
lzma-rust2 = { version = "0.25", default-features = false, features = [
    "std",
    "optimization",
] }
# gaki-steam-vent: EResult from its wire value
num_enum = "0.7"
# rust-protobuf runtime. >=3.7.2 for RUSTSEC-2024-0437 (unbounded recursion on
# nested messages); every binding is generated in-tree against it.
protobuf = "3.7.2"
# Pure-Rust codegen (no protoc); tracks the `protobuf` runtime
protobuf-codegen = "3.7.2"
# gaki-steam-vent-proto's build.rs: parses the protos to map EMsg kinds
protobuf-parse = "3.7.2"
# Terminal QR rendering for `login --qr`
qrcode = { version = "0.14", default-features = false }
# Crossterm comes re-exported as `ratatui::crossterm`, which keeps the two in step.
# `unstable-rendered-line-info`: `Paragraph::line_count`, the wrapped height
# the Store overlay clamps its scroll to.
ratatui = { version = "0.30", features = [
    "serde",
    "unstable-rendered-line-info",
] }
ratatui-image = { version = "11", default-features = false, features = [
    "crossterm",
] }
# Match gaki-steam-vent's rand version so only one copy is linked
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "socks",
] }
rpassword = "7"
# gaki-steam-vent: the CM websocket's TLS config
rustls = "0.23"
# gaki-steam-vent-crypto: the login password's RSA key. >= 0.10 for
# RUSTSEC-2023-0071 (Marvin); PKCS#1 v1.5 is opt-in there and Steam requires it
# (encryption only; no private key is ever used).
rsa = { version = "0.10", default-features = false, features = [
    "std",
    "getrandom",
    "pkcs1v15",
] }
# gaki-steam-cdn: Steam's VSZ (Zstandard) chunk containers
ruzstd = "0.9"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
# Raw binary PICS VDF parsing (not supported by keyvalues-serde or gaki-steam-vent)
steam-vdf-parser = "0.1"
steamid-ng = "3"
# Process listing for `kill`/`daemon`; `disk` for free-space checks
sysinfo = { version = "0.40", default-features = false, features = [
    "system",
    "disk",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "time",
    "net",
    "io-util",
    "sync",
    "io-std",
    "process",
] }
toml = "1"
toml_edit = "0.25"
# Consume gaki-steam-vent's notification broadcast streams (friend chat events)
tokio-stream = "0.1"
# gaki-steam-vent: the CM websocket transport
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# gaki-steam-vent: the heartbeat task's cancellation token
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
# gaki-steam-vent: the CM websocket's TLS roots
webpki-roots = "1"
# Steam Cloud serves deflate-compressed single-file archives; nothing else is read
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
