[package]
name = "gaki-steam-vent"
description = "Steam CM network client: login, sessions, RPC (fork of aurelia-steam-vent)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# Friend-chat client (fork of aurelia-steam-vent-chat)
chat = []

[dependencies]
base64.workspace = true
bytes.workspace = true
dashmap.workspace = true
flate2.workspace = true
futures.workspace = true
gaki-steam-vent-crypto.workspace = true
gaki-steam-vent-proto.workspace = true
num_enum.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
steamid-ng.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }
